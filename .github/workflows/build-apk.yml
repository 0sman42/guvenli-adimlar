name: Android APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dosyalari Cihaza Cek
        uses: actions/checkout@v4

      - name: 2. ZIP Dosyasini Otomatik Ac
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
          fi

      - name: 3. Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: 5. Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. APK Dosyasini Derle
        run: gradle assembleDebug --no-daemon

      - name: 7. Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Guvenli-Adimlar-APK
          path: app/build/outputs/apk/debug/*.apk
