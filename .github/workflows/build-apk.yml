name: Android APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dosyalari Cihaza Cek
        uses: actions/checkout@v4

      - name: 2. PIN Korumali ve Tam Ekran Kilitli Surumu Olustur
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          mkdir -p app/src/main/java/com/guvenliadimlar/app

          # 1. AndroidManifest.xml (Oto-Baslatma, Pil Koruma ve Tam Ekran Kilit Izinleri)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:label="Güvenli Adımlar"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SafetyForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="location" />

                  <receiver
                      android:name=".BootAndRestartReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="com.guvenliadimlar.app.RESTART_SERVICE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 2. BootAndRestartReceiver.kt (Telefon Acildiginda veya Kapatilmaya Calisildiginda Otomatik Baslatir)
          cat << 'EOF' > app/src/main/java/com/guvenliadimlar/app/BootAndRestartReceiver.kt
          package com.guvenliadimlar.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat

          class BootAndRestartReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  val prefs = context.getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  val role = prefs.getString("role", "") ?: ""
                  if (role == "child") {
                      try {
                          val svc = Intent(context, SafetyForegroundService::class.java)
                          ContextCompat.startForegroundService(context, svc)
                      } catch (_: Exception) {}
                  }
              }
          }
          EOF

          # 3. CloudSyncHelper.kt
          cat << 'EOF' > app/src/main/java/com/guvenliadimlar/app/CloudSyncHelper.kt
          package com.guvenliadimlar.app

          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL

          object CloudSyncHelper {
              private fun getTopic(familyCode: String, type: String): String {
                  return "guvenli_adimlar_v3_${familyCode.trim()}_$type"
              }

              fun pushData(familyCode: String, type: String, jsonPayload: String): Boolean {
                  val topic = getTopic(familyCode, type)
                  try {
                      val url = URL("https://ntfy.sh/$topic")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "PUT"
                          connectTimeout = 10000
                          readTimeout = 10000
                          doOutput = true
                          setRequestProperty("Content-Type", "text/plain; charset=UTF-8")
                      }
                      OutputStreamWriter(conn.outputStream, "UTF-8").use { it.write(jsonPayload) }
                      if (conn.responseCode in 200..299) return true
                  } catch (_: Exception) {}
                  return false
              }

              fun pullData(familyCode: String, type: String): JSONObject? {
                  val topic = getTopic(familyCode, type)
                  try {
                      val url = URL("https://ntfy.sh/$topic/json?poll=1&since=24h")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          connectTimeout = 10000
                          readTimeout = 10000
                      }
                      if (conn.responseCode in 200..299) {
                          val lines = conn.inputStream.bufferedReader().use { it.readLines() }
                          var lastMessagePayload: String? = null
                          for (line in lines) {
                              if (line.isNotBlank()) {
                                  val wrapper = JSONObject(line)
                                  if (wrapper.optString("event") == "message") {
                                      val msg = wrapper.optString("message", "")
                                      if (msg.startsWith("{")) {
                                          lastMessagePayload = msg
                                      }
                                  }
                              }
                          }
                          if (lastMessagePayload != null) {
                              return JSONObject(lastMessagePayload)
                          }
                      }
                  } catch (_: Exception) {}
                  return null
              }
          }
          EOF

          # 4. UsageStatsHelper.kt
          cat << 'EOF' > app/src/main/java/com/guvenliadimlar/app/UsageStatsHelper.kt
          package com.guvenliadimlar.app

          import android.annotation.SuppressLint
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.location.LocationManager
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          data class AppUsageItem(val packageName: String, val appName: String, val minutes: Long)

          object UsageStatsHelper {
              fun getAppName(context: Context, pkg: String): String {
                  return try {
                      val pm = context.packageManager
                      val info = pm.getApplicationInfo(pkg, 0)
                      pm.getApplicationLabel(info).toString()
                  } catch (_: Exception) {
                      pkg.substringAfterLast(".")
                  }
              }

              fun getDailyUsage(context: Context): List<AppUsageItem> {
                  val usm = context.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                  }
                  val stats = usm.queryUsageStats(
                      UsageStatsManager.INTERVAL_DAILY,
                      cal.timeInMillis,
                      System.currentTimeMillis()
                  )
                  val map = mutableMapOf<String, Long>()
                  for (s in stats) {
                      if (s.totalTimeInForeground >= 30_000L && s.packageName != context.packageName) {
                          val mins = (s.totalTimeInForeground / 60_000L).coerceAtLeast(1L)
                          map[s.packageName] = (map[s.packageName] ?: 0L) + mins
                      }
                  }
                  return map.entries.map { (pkg, mins) ->
                      AppUsageItem(pkg, getAppName(context, pkg), mins)
                  }.sortedByDescending { it.minutes }
              }

              fun getForegroundApp(context: Context): String? {
                  val usm = context.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val end = System.currentTimeMillis()
                  val begin = end - 10_000L
                  val events = usm.queryEvents(begin, end)
                  val event = UsageEvents.Event()
                  var currentPkg: String? = null
                  while (events.hasNextEvent()) {
                      events.getNextEvent(event)
                      if (event.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                          currentPkg = event.packageName
                      }
                  }
                  return currentPkg
              }

              @SuppressLint("MissingPermission")
              fun buildAndPushChildStatus(context: Context, familyCode: String): Boolean {
                  if (familyCode.length < 4) return false
                  return try {
                      val lm = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      var loc = try { lm.getLastKnownLocation(LocationManager.GPS_PROVIDER) } catch (_: Exception) { null }
                      if (loc == null) {
                          loc = try { lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER) } catch (_: Exception) { null }
                      }
                      if (loc == null) {
                          loc = try { lm.getLastKnownLocation(LocationManager.PASSIVE_PROVIDER) } catch (_: Exception) { null }
                      }

                      val usageList = getDailyUsage(context)
                      val appsJson = JSONArray()
                      for (item in usageList) {
                          val obj = JSONObject().apply {
                              put("pkg", item.packageName)
                              put("name", item.appName)
                              put("mins", item.minutes)
                          }
                          appsJson.put(obj)
                      }

                      val prefs = context.getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                      val settingsLocked = prefs.getBoolean("lock_settings", false)

                      val timeStr = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      val payload = JSONObject().apply {
                          put("lat", loc?.latitude ?: 0.0)
                          put("lon", loc?.longitude ?: 0.0)
                          put("updatedAt", timeStr)
                          put("timestamp", System.currentTimeMillis())
                          put("settingsLocked", settingsLocked)
                          put("apps", appsJson)
                      }

                      val ok = CloudSyncHelper.pushData(familyCode, "status", payload.toString())

                      val limitsObj = CloudSyncHelper.pullData(familyCode, "limits")
                      if (limitsObj != null) {
                          prefs.edit().putString("limits_json", limitsObj.toString()).apply()
                      }
                      ok
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF

          # 5. SafetyForegroundService.kt (Uygulamayi Acmadan Dogrudan Ekran Ustu Kilit + PIN Korumasi + Oto-Yeniden Baslatma)
          cat << 'EOF' > app/src/main/java/com/guvenliadimlar/app/SafetyForegroundService.kt
          package com.guvenliadimlar.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import org.json.JSONObject
          import kotlin.concurrent.thread

          class SafetyForegroundService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = false
              private var overlayView: View? = null
              private var unlockedUntilMs: Long = 0L

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Güvenli Adımlar - Ebeveyn Koruması Aktif")
                      .setContentText("Bu servis ebeveyn kontrolü altındadır.")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .build()

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                      } else {
                          startForeground(1, notification)
                      }
                  } catch (_: Exception) {}

                  if (!isRunning) {
                      isRunning = true
                      startSyncLoop()
                      startBlockerLoop()
                  }
                  return START_STICKY
              }

              private fun startSyncLoop() {
                  val runnable = object : Runnable {
                      override fun run() {
                          val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                          val code = prefs.getString("family_code", "") ?: ""
                          thread {
                              UsageStatsHelper.buildAndPushChildStatus(this@SafetyForegroundService, code)
                          }
                          handler.postDelayed(this, 20_000L) // Her 20 saniyede bir canli sinyal (Heartbeat)
                      }
                  }
                  handler.post(runnable)
              }

              private fun startBlockerLoop() {
                  val runnable = object : Runnable {
                      override fun run() {
                          checkAndEnforceAppLimits()
                          handler.postDelayed(this, 2_500L) // Her 2.5 saniyede bir kontrol
                      }
                  }
                  handler.post(runnable)
              }

              private fun checkAndEnforceAppLimits() {
                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  val fgPkg = UsageStatsHelper.getForegroundApp(this) ?: return
                  if (fgPkg == packageName || fgPkg.contains("launcher") || fgPkg.contains("systemui")) return

                  // 1. Eger Cocuk Uygulamayi Kapatmak/Silmek Icin Telefon Ayarlarina Girerse PIN Sor!
                  val lockSettings = prefs.getBoolean("lock_settings", false)
                  if (lockSettings && System.currentTimeMillis() > unlockedUntilMs) {
                      if (fgPkg == "com.android.settings" || fgPkg.contains("packageinstaller")) {
                          showDirectScreenLockOverlay(
                              title = "🔒 Telefon Ayarları Kilitli!",
                              message = "Güvenli Adımlar uygulamasının kapatılmasını veya silinmesini önlemek için Ayarlar menüsü Ebeveyn PIN şifresi ile korunmaktadır.",
                              requirePin = true
                          )
                          return
                      }
                  }

                  // 2. Uygulama Gunluk Sure Siniri Kontrolu
                  val limitsStr = prefs.getString("limits_json", "{}") ?: "{}"
                  try {
                      val limitsJson = JSONObject(limitsStr)
                      if (!limitsJson.has(fgPkg)) return
                      val maxMins = limitsJson.getLong(fgPkg)
                      val usageList = UsageStatsHelper.getDailyUsage(this)
                      val usedMins = usageList.find { it.packageName == fgPkg }?.minutes ?: 0L

                      if (usedMins >= maxMins && System.currentTimeMillis() > unlockedUntilMs) {
                          val appName = UsageStatsHelper.getAppName(this, fgPkg)
                          showDirectScreenLockOverlay(
                              title = "⏰ Süre Sınırı Doldu!",
                              message = "$appName uygulaması için ebeveyniniz tarafından belirlenen günlük $maxMins dakika kullanım süreniz dolmuştur.",
                              requirePin = false
                          )
                      }
                  } catch (_: Exception) {}
              }

              // Uygulamayi Acmadan Dogrudan Ekranin Ustune Tam Ekran Kilit Indiren Metod
              private fun showDirectScreenLockOverlay(title: String, message: String, requirePin: Boolean) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      return
                  }
                  if (overlayView != null) return

                  // Arka plandaki uygulamayi aninda ana ekrana dusur
                  val homeIntent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_HOME)
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                  }
                  startActivity(homeIntent)

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val layoutFlag = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutFlag,
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#F2111827"))
                      setPadding(64, 64, 64, 64)
                  }

                  val titleView = TextView(this).apply {
                      text = title
                      setTextColor(Color.parseColor("#F87171"))
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }
                  container.addView(titleView)

                  val msgView = TextView(this).apply {
                      text = message
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      gravity = Gravity.CENTER
                      setPadding(0, 32, 0, 48)
                  }
                  container.addView(msgView)

                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  val savedPin = prefs.getString("parent_pin", "1234") ?: "1234"

                  val pinInput = EditText(this).apply {
                      hint = "Ebeveyn 4 Haneli PIN Şifresi"
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setBackgroundColor(Color.parseColor("#1F2937"))
                      setPadding(32, 32, 32, 32)
                  }
                  container.addView(pinInput)

                  val spacer1 = View(this).apply { minimumHeight = 32 }
                  container.addView(spacer1)

                  val btnUnlockWithPin = Button(this).apply {
                      text = "🔑 Ebeveyn PIN ile Geçici İzin Ver (5 Dk)"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#10B981"))
                      setPadding(32, 32, 32, 32)
                      setOnClickListener {
                          if (pinInput.text.toString().trim() == savedPin) {
                              unlockedUntilMs = System.currentTimeMillis() + 5 * 60_000L
                              removeOverlay()
                              Toast.makeText(this@SafetyForegroundService, "5 dakika geçici ebeveyn izni verildi.", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this@SafetyForegroundService, "Hatalı Ebeveyn PIN Şifresi!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  container.addView(btnUnlockWithPin)

                  val spacer2 = View(this).apply { minimumHeight = 24 }
                  container.addView(spacer2)

                  val btnGoHome = Button(this).apply {
                      text = "🏠 Tamam, Ana Ekrana Dön"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#3B82F6"))
                      setPadding(32, 32, 32, 32)
                      setOnClickListener {
                          val hIntent = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_HOME)
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(hIntent)
                          removeOverlay()
                      }
                  }
                  container.addView(btnGoHome)

                  overlayView = container
                  try {
                      wm.addView(overlayView, params)
                  } catch (_: Exception) {
                      overlayView = null
                  }
              }

              private fun removeOverlay() {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  overlayView?.let {
                      try { wm.removeView(it) } catch (_: Exception) {}
                  }
                  overlayView = null
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  // Cocuk son uygulamalardan kaydirip kapatirsa aninda yeniden baslat!
                  val restartIntent = Intent(applicationContext, BootAndRestartReceiver::class.java).apply {
                      action = "com.guvenliadimlar.app.RESTART_SERVICE"
                  }
                  sendBroadcast(restartIntent)
                  super.onTaskRemoved(rootIntent)
              }

              override fun onDestroy() {
                  removeOverlay()
                  val restartIntent = Intent(applicationContext, BootAndRestartReceiver::class.java).apply {
                      action = "com.guvenliadimlar.app.RESTART_SERVICE"
                  }
                  sendBroadcast(restartIntent)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Güvenli Adımlar Koruması",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
              }

              companion object {
                  private const val CHANNEL_ID = "guvenli_adimlar_channel"
              }
          }
          EOF

          # 6. MainActivity.kt (12 Haneli Kod + Ebeveyn PIN Korumasi + Canli Acik/Kapali Göstergesi)
          cat << 'EOF' > app/src/main/java/com/guvenliadimlar/app/MainActivity.kt
          package com.guvenliadimlar.app

          import android.Manifest
          import android.app.AlertDialog
          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.os.Process
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONObject
          import kotlin.concurrent.thread
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private lateinit var rootLayout: LinearLayout
              private var lastLat: Double = 0.0
              private var lastLon: Double = 0.0
              private var childStatusText: TextView? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#12161F"))
                      isFillViewport = true
                  }
                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 64)
                  }
                  scroll.addView(rootLayout)
                  setContentView(scroll)

                  renderCurrentScreen()
              }

              private fun renderCurrentScreen() {
                  rootLayout.removeAllViews()
                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  val role = prefs.getString("role", "") ?: ""
                  val code = prefs.getString("family_code", "") ?: ""

                  if (role.isEmpty() || code.isEmpty()) {
                      renderRoleSelectionScreen()
                  } else if (role == "parent") {
                      renderParentDashboard(code)
                  } else {
                      val svc = Intent(this, SafetyForegroundService::class.java)
                      try { ContextCompat.startForegroundService(this, svc) } catch (_: Exception) {}
                      renderChildScreen(code)
                  }
              }

              private fun generate12DigitCode(): String {
                  val part1 = Random.nextInt(100000, 999999).toString()
                  val part2 = Random.nextInt(100000, 999999).toString()
                  return part1 + part2
              }

              private fun renderRoleSelectionScreen() {
                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)

                  addHeader("Güvenli Adımlar", "Şifreli & Tam Ekran Kilitli Aile Güvenliği")

                  val codeInput = EditText(this).apply {
                      hint = "12 Haneli Güvenlik Kodu (Örn: 849201736482)"
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setPadding(32, 32, 32, 32)
                      setBackgroundColor(Color.parseColor("#1E2430"))
                  }
                  rootLayout.addView(codeInput)

                  addSpacer(16)

                  val btnGenerate = createStyledButton("🔐 12 Haneli Güvenli Aile Kodu Üret", "#3B82F6") {
                      codeInput.setText(generate12DigitCode())
                  }
                  rootLayout.addView(btnGenerate)

                  addSpacer(24)

                  val pinInput = EditText(this).apply {
                      hint = "4 Haneli Ebeveyn PIN Şifresi Belirleyin (Örn: 1923)"
                      setHintTextColor(Color.LTGRAY)
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(32, 32, 32, 32)
                      setBackgroundColor(Color.parseColor("#1E2430"))
                  }
                  rootLayout.addView(pinInput)

                  addSpacer(32)

                  val btnParent = createStyledButton("👨‍👩‍👧 BU TELEFON: EBEVEYN TELEFONU\n(Uzaktan Durum Gör & Süre Sınırı Koy)", "#10B981") {
                      val c = codeInput.text.toString().trim()
                      if (c.length < 8) {
                          Toast.makeText(this, "Lütfen güvenlik için en az 8-12 haneli bir Aile Kodu girin", Toast.LENGTH_SHORT).show()
                      } else {
                          prefs.edit().putString("role", "parent").putString("family_code", c).apply()
                          renderCurrentScreen()
                      }
                  }
                  rootLayout.addView(btnParent)

                  addSpacer(24)

                  val btnChild = createStyledButton("👧 BU TELEFON: ÇOCUK TELEFONU\n(Şifreli Koruma & Doğrudan Ekran Kilidi)", "#F59E0B") {
                      val c = codeInput.text.toString().trim()
                      val p = pinInput.text.toString().trim()
                      if (c.length < 8) {
                          Toast.makeText(this, "Lütfen Ebeveyn telefonundaki 12 haneli Aile Kodunu girin", Toast.LENGTH_SHORT).show()
                      } else if (p.length < 4) {
                          Toast.makeText(this, "Çocuğun uygulamayı kapatamaması için 4 haneli Ebeveyn PIN şifresi belirleyin!", Toast.LENGTH_LONG).show()
                      } else {
                          prefs.edit()
                              .putString("role", "child")
                              .putString("family_code", c)
                              .putString("parent_pin", p)
                              .apply()
                          renderCurrentScreen()
                      }
                  }
                  rootLayout.addView(btnChild)
              }

              // EBEVEYN EKRANI
              private fun renderParentDashboard(code: String) {
                  addHeader("👨‍👩‍👧 Ebeveyn Kontrol Paneli", "Güvenli Kanal Kodu: $code")

                  val statusBox = TextView(this).apply {
                      text = "Çocuk telefonunun açık/kapalı durumu kontrol ediliyor..."
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setPadding(32, 32, 32, 32)
                      setBackgroundColor(Color.parseColor("#1E2430"))
                  }
                  rootLayout.addView(statusBox)

                  addSpacer(20)

                  val btnMap = createStyledButton("📍 Çocuğun Konumunu Haritada Aç", "#3B82F6") {
                      if (lastLat == 0.0 && lastLon == 0.0) {
                          Toast.makeText(this, "Henüz çocuk telefonundan GPS konumu gelmedi.", Toast.LENGTH_SHORT).show()
                      } else {
                          val uri = Uri.parse("https://www.google.com/maps/search/?api=1&query=$lastLat,$lastLon")
                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                      }
                  }
                  rootLayout.addView(btnMap)

                  addSpacer(16)

                  val appsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val btnRefresh = createStyledButton("🔄 Şimdi Yenile (Uygulama Açık mı & Süreleri Çek)", "#10B981") {
                      fetchChildDataForParent(code, statusBox, appsContainer)
                  }
                  rootLayout.addView(btnRefresh)

                  addSpacer(16)

                  val btnWakeUp = createStyledButton("🔔 Çocuk Cihazına Uyandırma Sinyali Gönder", "#8B5CF6") {
                      thread {
                          val wakeJson = JSONObject().apply { put("wake", System.currentTimeMillis()) }
                          val ok = CloudSyncHelper.pushData(code, "wakeup", wakeJson.toString())
                          runOnUiThread {
                              if (ok) {
                                  Toast.makeText(this, "Uyandırma sinyali gönderildi! 10 sn sonra 'Şimdi Yenile'ye basın.", Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
                  rootLayout.addView(btnWakeUp)

                  addSpacer(32)

                  val appsTitle = TextView(this).apply {
                      text = "📱 Çocuğun Kullandığı Uygulamalar\n(Süre sınırı koymak için uygulamanın üzerine dokunun)"
                      setTextColor(Color.parseColor("#93C5FD"))
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                  }
                  rootLayout.addView(appsTitle)

                  addSpacer(16)
                  rootLayout.addView(appsContainer)

                  addSpacer(48)
                  val btnReset = createStyledButton("⚙️ Cihaz Rolünü / Aile Kodunu Değiştir", "#4B5563") {
                      getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE).edit().clear().apply()
                      renderCurrentScreen()
                  }
                  rootLayout.addView(btnReset)

                  fetchChildDataForParent(code, statusBox, appsContainer)
              }

              private fun fetchChildDataForParent(code: String, statusBox: TextView, appsContainer: LinearLayout) {
                  statusBox.text = "Buluttan çocuk cihazı durumu sorgulanıyor..."
                  thread {
                      val data = CloudSyncHelper.pullData(code, "status")
                      val limitsData = CloudSyncHelper.pullData(code, "limits") ?: JSONObject()

                      runOnUiThread {
                          appsContainer.removeAllViews()
                          if (data == null) {
                              statusBox.text = "🔴 CİHAZ DURUMU: BAĞLANTI YOK\n\nHenüz '$code' kodlu çocuk telefonundan veri gelmedi."
                              return@runOnUiThread
                          }

                          lastLat = data.optDouble("lat", 0.0)
                          lastLon = data.optDouble("lon", 0.0)
                          val updated = data.optString("updatedAt", "-")
                          val ts = data.optLong("timestamp", 0L)
                          val settingsLocked = data.optBoolean("settingsLocked", false)

                          val diffSec = if (ts > 0L) (System.currentTimeMillis() - ts) / 1000L else 999L
                          val onlineStatus = when {
                              diffSec <= 75L -> "🟢 AÇIK VE AKTİF (Şu an çalışıyor)"
                              diffSec <= 300L -> "🟡 ARKA PLANDA (${diffSec / 60} dk önce sinyal alındı)"
                              else -> "🔴 KAPALI VEYA İNTERNET YOK (Son sinyal: $updated)"
                          }
                          val lockInfo = if (settingsLocked) "🔒 Ayarlar/Silme Koruması: AÇIK" else "🔓 Ayarlar Koruması: Kapalı"
                          val locText = if (lastLat != 0.0) "$lastLat, $lastLon" else "Konum Bekleniyor"

                          statusBox.text = "📡 Durum: $onlineStatus\n$lockInfo\n🕒 Son Sinyal Saati: $updated\n📍 Çocuk Konumu: $locText"

                          val apps = data.optJSONArray("apps")
                          if (apps == null || apps.length() == 0) {
                              val emptyView = TextView(this).apply {
                                  text = "Henüz uygulama kullanım verisi yok."
                                  setTextColor(Color.LTGRAY)
                              }
                              appsContainer.addView(emptyView)
                          } else {
                              for (i in 0 until apps.length()) {
                                  val item = apps.getJSONObject(i)
                                  val pkg = item.optString("pkg")
                                  val name = item.optString("name", pkg)
                                  val mins = item.optLong("mins", 0L)
                                  val currentLimit = if (limitsData.has(pkg)) "⏰ Sınır: ${limitsData.optLong(pkg)} dk" else "Sınır Yok"

                                  val appBtn = createStyledButton(
                                      "• $name: $mins dk kullanıldı ($currentLimit)\n   [Süre Sınırı Koymak İçin Dokun]",
                                      "#1E293B"
                                  ) {
                                      showSetLimitDialog(code, pkg, name, limitsData) {
                                          fetchChildDataForParent(code, statusBox, appsContainer)
                                      }
                                  }
                                  appsContainer.addView(appBtn)
                                  appsContainer.addView(Space(this).apply { minimumHeight = 16 })
                              }
                          }
                      }
                  }
              }

              private fun showSetLimitDialog(code: String, pkg: String, appName: String, currentLimits: JSONObject, onSaved: () -> Unit) {
                  val input = EditText(this).apply {
                      hint = "Günlük izin verilen dakika (Örn: 30, Kaldırmak için 0)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  AlertDialog.Builder(this)
                      .setTitle("$appName - Süre Sınırı Koy")
                      .setMessage("Süre dolduğunda uygulama açılmadan doğrudan çocuğun ekranına tam ekran kilit iner. Günlük kaç dakika izin verilsin?")
                      .setView(input)
                      .setPositiveButton("Kaydet ve Uygula") { _, _ ->
                          val mins = input.text.toString().toLongOrNull() ?: 0L
                          if (mins <= 0L) {
                              currentLimits.remove(pkg)
                          } else {
                              currentLimits.put(pkg, mins)
                          }
                          thread {
                              val ok = CloudSyncHelper.pushData(code, "limits", currentLimits.toString())
                              runOnUiThread {
                                  if (ok) {
                                      Toast.makeText(this, "$appName için süre sınırı gönderildi!", Toast.LENGTH_SHORT).show()
                                      onSaved()
                                  }
                              }
                          }
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              // COCUK EKRANI
              private fun renderChildScreen(code: String) {
                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  addHeader("👧 Çocuk Koruması Aktif", "Güvenli Kanal Kodu: $code")

                  val statusLabel = TextView(this).apply {
                      text = "🛡️ Bu cihaz Ebeveyn PIN şifresi ile korunmaktadır. Lütfen aşağıdaki kurulum adımlarını tamamlayın."
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setPadding(32, 32, 32, 32)
                      setBackgroundColor(Color.parseColor("#1E2430"))
                  }
                  childStatusText = statusLabel
                  rootLayout.addView(statusLabel)

                  addSpacer(20)

                  val btnPerm1 = createStyledButton("1. Adım: Konum İzni Ver ('Her Zaman İzin Ver' Seçin)", "#3B82F6") {
                      val perms = mutableListOf(
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      ActivityCompat.requestPermissions(this, perms.toTypedArray(), 1001)
                  }
                  rootLayout.addView(btnPerm1)

                  addSpacer(14)

                  val btnPerm2 = createStyledButton("2. Adım: Uygulama Kullanım Erişimi İzni Ver", "#10B981") {
                      if (!hasUsageStatsPermission()) {
                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                      } else {
                          Toast.makeText(this, "Kullanım Erişimi İzni Hazır ✅", Toast.LENGTH_SHORT).show()
                      }
                  }
                  rootLayout.addView(btnPerm2)

                  addSpacer(14)

                  val btnPerm3 = createStyledButton("3. Adım: Doğrudan Ekran Üstü Kilit İzni ('Üstte Göster')", "#F59E0B") {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "Ekran Üstü Kilit İzni Hazır ✅", Toast.LENGTH_SHORT).show()
                      }
                  }
                  rootLayout.addView(btnPerm3)

                  addSpacer(14)

                  val btnBattery = createStyledButton("4. Adım: ⚡ Pil Kısıtlamasını Kaldır (Kapanmayı Önler)", "#EC4899") {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } else {
                              Toast.makeText(this, "Arka Plan Pil Koruması Aktif ✅", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  rootLayout.addView(btnBattery)

                  addSpacer(14)

                  val isLocked = prefs.getBoolean("lock_settings", false)
                  val lockBtnText = if (isLocked) "🔒 5. Adım: Ayarlar & Kapatma Koruması: AÇIK (Değiştirmek İçin PIN Gerekir)"
                                    else "🔓 5. Adım: Çocuğun Uygulamayı Kapatmasını Engelle (Ayarları Kilitle)"

                  val btnLockSettings = createStyledButton(lockBtnText, "#EF4444") {
                      if (!isLocked) {
                          prefs.edit().putBoolean("lock_settings", true).apply()
                          Toast.makeText(this, "Kapatma/Silme Koruması Açıldı! Artık Ayarlar'a girildiğinde Ebeveyn PIN sorulacak.", Toast.LENGTH_LONG).show()
                          renderCurrentScreen()
                      } else {
                          askPinThenExecute("Ayarlar kilidini kapatmak için Ebeveyn PIN şifresini girin:") {
                              prefs.edit().putBoolean("lock_settings", false).apply()
                              renderCurrentScreen()
                          }
                      }
                  }
                  rootLayout.addView(btnLockSettings)

                  addSpacer(24)

                  val btnSyncNow = createStyledButton("🚀 Verileri Şimdi Ebeveyn Telefonuna Gönder", "#8B5CF6") {
                      statusLabel.text = "⏳ Veriler buluta gönderiliyor..."
                      val svc = Intent(this, SafetyForegroundService::class.java)
                      try { ContextCompat.startForegroundService(this, svc) } catch (_: Exception) {}

                      thread {
                          val ok = UsageStatsHelper.buildAndPushChildStatus(this, code)
                          runOnUiThread {
                              if (ok) {
                                  statusLabel.text = "✅ Veriler Başarıyla Gönderildi! Ebeveyn telefonunda '🟢 AÇIK VE AKTİF' olarak görünüyor."
                              } else {
                                  statusLabel.text = "❌ Gönderim başarısız. İnterneti kontrol edin."
                              }
                          }
                      }
                  }
                  rootLayout.addView(btnSyncNow)

                  addSpacer(48)

                  val btnReset = createStyledButton("🔐 Cihaz Rolünü Sıfırla (Ebeveyn PIN Şifresi İster)", "#4B5563") {
                      askPinThenExecute("Çocuk korumasını kaldırmak için 4 haneli Ebeveyn PIN şifrenizi girin:") {
                          stopService(Intent(this, SafetyForegroundService::class.java))
                          prefs.edit().clear().apply()
                          renderCurrentScreen()
                      }
                  }
                  rootLayout.addView(btnReset)
              }

              private fun askPinThenExecute(message: String, onSuccess: () -> Unit) {
                  val prefs = getSharedPreferences("guvenli_prefs", Context.MODE_PRIVATE)
                  val savedPin = prefs.getString("parent_pin", "1234") ?: "1234"
                  val input = EditText(this).apply {
                      hint = "4 Haneli Ebeveyn PIN"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                  }
                  AlertDialog.Builder(this)
                      .setTitle("🔒 Ebeveyn Şifresi Gerekli")
                      .setMessage(message)
                      .setView(input)
                      .setPositiveButton("Onayla") { _, _ ->
                          if (input.text.toString().trim() == savedPin) {
                              onSuccess()
                          } else {
                              Toast.makeText(this, "❌ Hatalı Ebeveyn PIN Şifresi! İşlem engellendi.", Toast.LENGTH_LONG).show()
                          }
                      }
                      .setNegativeButton("İptal", null)
                      .show()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1001 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      val svc = Intent(this, SafetyForegroundService::class.java)
                      try { ContextCompat.startForegroundService(this, svc) } catch (_: Exception) {}
                      childStatusText?.text = "✅ Konum izni onaylandı ve kesintisiz koruma servisi başlatıldı!"
                  }
              }

              private fun hasUsageStatsPermission(): Boolean {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = appOps.checkOpNoThrow(
                      AppOpsManager.OPSTR_GET_USAGE_STATS,
                      Process.myUid(),
                      packageName
                  )
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun addHeader(titleStr: String, subStr: String) {
                  val title = TextView(this).apply {
                      text = titleStr
                      setTextColor(Color.WHITE)
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                  }
                  val sub = TextView(this).apply {
                      text = subStr
                      setTextColor(Color.parseColor("#93C5FD"))
                      textSize = 14f
                      setPadding(0, 8, 0, 28)
                  }
                  rootLayout.addView(title)
                  rootLayout.addView(sub)
              }

              private fun addSpacer(h: Int) {
                  rootLayout.addView(Space(this).apply { minimumHeight = h })
              }

              private fun createStyledButton(textStr: String, bgHex: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = textStr
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor(bgHex))
                      setPadding(32, 34, 32, 34)
                      gravity = Gravity.CENTER
                      setOnClickListener { onClick() }
                  }
              }
          }
          EOF

      - name: 3. Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Android SDK Lisanslarini Onayla
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. APK Dosyasini Derle
        run: gradle assembleDebug --no-daemon

      - name: 7. Uretilen APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Guvenli-Adimlar-APK
          path: app/build/outputs/apk/debug/*.apk
